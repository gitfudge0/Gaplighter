<!doctype html><html lang="en"><meta charset="utf-8"><title>Gaplighter layout regression fixtures</title><style>
*{box-sizing:border-box}body{margin:24px;font:14px system-ui}h1{font-size:24px}.case{display:flex;flex-direction:column;gap:16px;width:320px;padding:20px;background:#fafafa;margin:24px 0}.case>div{min-width:40px;min-height:40px;background:#d9e9df;flex-shrink:0}.row{flex-direction:row}.grid{display:grid;grid-template-columns:1fr 1fr}.wrap{flex-direction:row;flex-wrap:wrap;width:160px}.reverse{flex-direction:row-reverse}.block{display:block}.border{border:10px solid #333}.scaled{transform:scale(1.5);transform-origin:top left;margin-bottom:100px}.rotate{transform:rotate(8deg)}.scroll{height:160px;overflow:auto}

<section id="block" class="case block"><div style="margin-bottom:24px">A</div><div>B</div></section>

<section id="border" class="case border"><div>A</div><div>B</div></section>
<section id="scaled" class="case scaled"><div>A</div><div>B</div></section>
<section id="contents" class="case"><div style="display:contents"><div style="height:40px">A</div><div style="height:40px">B</div></div><div>C</div></section>
